services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: runloyal
      MYSQL_USER: runloyal
      MYSQL_PASSWORD: runloyal
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - "-h"
        - localhost
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/runloyal
      DB_USER: runloyal
      DB_PASSWORD: runloyal
      OKTA_ISSUER_URI: ${OKTA_ISSUER_URI:?Set OKTA_ISSUER_URI to your Okta custom authorization server issuer}
      OKTA_AUDIENCE: ${OKTA_AUDIENCE:?Set OKTA_AUDIENCE to your Okta API audience}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
